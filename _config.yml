# ─────────────────────────────────────────────
#  장윤재 블로그 — Jekyll + Minimal Mistakes
#  이 파일을 수정한 뒤에는 GitHub에 올려야 반영됩니다 (1~2분 소요).
# ─────────────────────────────────────────────

remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "default"   # air, aqua, contrast, dark, dirt, neon, mint, plum, sunrise

# 사이트 기본 정보
locale: "ko-KR"
title: "장윤재 YunJae Jang · Computing Education Lab"
masthead_title: "Computing Education Lab"   # 상단 메뉴 왼쪽에 보이는 제목 (브라우저 탭·검색 결과에는 title 사용)
title_separator: "|"
name: "장윤재"
description: "YunJae Jang (장윤재), Kangwon National University — research on computing education, AI education, and digital literacy. 강원대학교 장윤재의 컴퓨팅 교육 · AI 교육 · 디지털 리터러시 연구"
url: "https://janggoons.github.io"
baseurl: ""
repository: "janggoons/janggoons.github.io"
timezone: Asia/Seoul
words_per_minute: 300
date_format: "%Y.%m.%d"

# 공유 미리보기 이미지 (카카오톡 · 메일 · SNS)
og_image: "/assets/images/og-card.png"

# 검색 (Ctrl+K 대신 상단 돋보기 아이콘)
search: true
search_full_content: true

# 댓글 — giscus 사용 시 README.md의 「댓글 켜기」 참고
comments:
  provider: false
  # provider: "giscus"
  # giscus:
  #   repo_id: ""
  #   category_name: "Comments"
  #   category_id: ""
  #   discussion_term: "pathname"
  #   reactions_enabled: "1"
  #   theme: "light"

# 방문자 통계 — Google Analytics 사용 시 provider를 "google-gtag"로
analytics:
  provider: false
  # google:
  #   tracking_id: "G-XXXXXXXXXX"

# 왼쪽 프로필 사이드바
author:
  name: "장윤재 YunJae Jang"
  avatar: "/assets/images/profile.jpg"
  bio: "강원대학교 강릉자유전공학부 조교수 · 학부장<br>컴퓨팅 교육 · AI 교육 · 디지털 리터러시"
  location: "강릉, 대한민국"
  links:
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0002-7958-8040"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.co.kr/citations?user=0KzD7EIAAAAJ"
    - label: "CV (English)"
      icon: "fas fa-fw fa-file-alt"
      url: "https://docs.google.com/document/d/1hSi9qDPFXdLzW0Us9hN4P-nbxZc5hayxOl--jcufM5Y/view?usp=sharing"
    - label: "CV (한국어)"
      icon: "fas fa-fw fa-file-alt"
      url: "https://docs.google.com/document/d/1X8UR2HIwXToLiSQd_jrs8X9i1CWWjq45-WO3AwCkhqk/view?usp=sharing"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/janggoons"
    - label: "Facebook"
      icon: "fab fa-fw fa-facebook-square"
      url: "https://www.facebook.com/janggoons"

footer:
  links:
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0002-7958-8040"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.co.kr/citations?user=0KzD7EIAAAAJ"
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:janggoons@gmail.com"

# 빌드 설정
include:
  - _pages
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-redirect-from   # 주소가 바뀐 페이지(/lectures/ → /teaching/ 등) 자동 이동

# 카테고리 · 태그 모아보기 페이지
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# 글 · 페이지 기본값
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      show_date: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
